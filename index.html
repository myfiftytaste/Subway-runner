<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Métrun</title>
<meta name="description" content="Tobias et moi courons les 16 lignes du métro parisien, d'un terminus à l'autre. Cette carte interactive en est la trace.">
<meta property="og:title" content="Métrun">
<meta property="og:description" content="Courir les 16 lignes du métro parisien, d'un terminus à l'autre.">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1E27" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FFCD00'/%3E%3Cpath d='M8.6 22.4 10.3 10.6 12.2 13.1 15.7 18.4 19.6 12.4 21.6 10.2 23.4 22.6' fill='none' stroke='%231E2B32' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23.4' cy='22.6' r='2.4' fill='%23FC4C02'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--app:start-->
<div class="app">
  <div class="side">
    <header class="intro">
      <div class="topbar">
        <p class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" class="mark-disc"/>
            <path d="M8.6 22.4 10.3 10.6 12.2 13.1 15.7 18.4 19.6 12.4 21.6 10.2 23.4 22.6" class="mark-trace"/>
            <circle cx="23.4" cy="22.6" r="2.4" class="mark-end"/>
          </svg>
          Métrun
        </p>
        <div class="tools">
          <button class="lang" id="lang" type="button"></button>
          <a class="live" id="live" href="https://www.strava.com" target="_blank" rel="noopener"><span data-i18n="live">Flux live Strava</span> <span class="rec" aria-hidden="true"></span></a>
        </div>
      </div>
      <p class="lede" data-i18n="lede"></p>
    </header>

    <section class="lines" aria-label="Lignes">
      <ol class="roundels" id="roundels"></ol>
      <div class="detail" id="detail"></div>
    </section>

    <section class="progress">
      <dl class="stats" id="stats"></dl>
      <div class="track" id="track">
        <div class="runners" id="runners" aria-hidden="true"></div>
      </div>
    </section>

    <section class="numbers" aria-labelledby="numbers-title">
      <h2 id="numbers-title" data-i18n="numbers">En chiffres</h2>
      <p class="numbers-hint" data-i18n="numbersHint"></p>
      <div class="facts" id="facts"></div>
      <figure class="hist">
        <figcaption>
          <b data-i18n="histTitle"></b>
          <span id="hist-sub"></span>
        </figcaption>
        <div class="bars" id="bars"></div>
      </figure>
      <p class="footnote" data-i18n="timeNote"></p>
    </section>

    <footer class="credits">
      <p data-i18n="credits1"></p>
      <p data-i18n="credits2"></p>
    </footer>
  </div>

  <div class="stage">
    <aside class="panel">
      <div class="donut" id="donut">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="44"/>
          <circle class="ring ring-km" id="ring-km" cx="50" cy="50" r="44" pathLength="100"/>
          <circle class="ring-track inner" cx="50" cy="50" r="31"/>
          <circle class="ring ring-st" id="ring-st" cx="50" cy="50" r="31" pathLength="100"/>
        </svg>
        <dl class="donut-legend" id="donut-legend"></dl>
      </div>
    </aside>

    <figure class="map" id="map">
      <svg id="svg" role="img" aria-labelledby="map-title" preserveAspectRatio="xMidYMid meet">
        <title id="map-title" data-i18n="mapTitle"></title>
      </svg>
      <svg class="north" viewBox="0 0 24 40" role="img" aria-label="N">
        <path d="M12 3 18 24 12 20 6 24Z" class="north-arrow"/>
        <text x="12" y="37" class="north-n">N</text>
      </svg>
      <svg class="leader" id="leader" aria-hidden="true"><line/><circle r="3"/></svg>
      <div class="sticker" id="sticker" aria-live="polite" hidden></div>
    </figure>

    <div class="key">
      <div class="scale" id="scale"><i></i><span></span></div>
      <ul class="legend">
        <li><i class="sw sw-run"></i><span data-i18n="run">Couru</span></li>
        <li><i class="sw sw-todo"></i><span data-i18n="toCome">À venir</span></li>
      </ul>
    </div>
  </div>
</div>
<!--app:end-->
<script src="app.js"></script>
</body>
</html>
